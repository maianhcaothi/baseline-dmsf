# DMSF Baseline Configuration

rabbit:
  address: localhost
  port: 5672
  username: guest
  password: guest
  virtual-host: /

server:
  clients: [1, 1]      # [num_edge, num_cloud]
  batch-size: 32

dmsf:
  split-point: auto          # auto | 3 | 5 | 7 | 10
  bandwidth-mbps: 100.0      # fallback khi measure_bandwidth: False
  measure_bandwidth: True    # True → đo thực tế qua RabbitMQ; False → dùng bandwidth-mbps cố định
  profile-cache: profiles/all_devices_bs32.json
  weights: best_dmsf26n.pt
  nc: 10
  conf: 0.001
  iou: 0.6
  imgsz: 640

data: video.mp4
log-path: .
debug-mode: false
